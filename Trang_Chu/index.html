<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Cá Thủy Cung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="aquarium">
        <!-- Nút điều khiển âm thanh -->
        <button id="music-btn" onclick="toggleMusic()">🔇 Bật nhạc thủy cung</button>
        <audio id="bg-music" src="thuycung.mp3" loop></audio>

        <!-- Tiên cá, Rùa, Cá mập, Bạch tuộc, Tàu ngầm -->
        <img src="tienca.png" id="tienca" class="creature" alt="Tiên cá">
        <img src="turtle.png" id="turtle" class="creature" alt="Rùa biển">
        <img src="shark.png" id="shark" class="creature" alt="Cá mập">
        <img src="bachtuot.png" id="bachtuot" class="creature" alt="Bạch tuộc">
        <img src="taungam.png" id="taungam" class="creature" alt="Tàu ngầm">

        <!-- 3 Thợ lặn di chuyển lên xuống & đụng tường lật trái/phải -->
        <img src="diver1.png" id="diver1" class="creature diver" style="top: 25%; left: 15%;" alt="Thợ lặn 1">
        <img src="diver2.png" id="diver2" class="creature diver" style="top: 45%; left: 48%;" alt="Thợ lặn 2">
        <img src="diver3.png" id="diver3" class="creature diver" style="top: 30%; left: 78%;" alt="Thợ lặn 3">

        <!-- Đàn cá xám (Gốc: đầu trái, đuôi phải) -->
        <img src="caxam.png" class="creature school-xam" style="top: 14%; left: 8%;" alt="Cá xám">
        <img src="caxam.png" class="creature school-xam" style="top: 24%; left: 20%;" alt="Cá xám">
        <img src="caxam.png" class="creature school-xam" style="top: 20%; left: 2%;" alt="Cá xám">

        <!-- Đàn cá xanh (Gốc: đầu phải, đuôi trái) -->
        <img src="caxanh.png" class="creature school-xanh" style="top: 46%; left: 60%;" alt="Cá xanh">
        <img src="caxanh.png" class="creature school-xanh" style="top: 56%; left: 72%;" alt="Cá xanh">
        <img src="caxanh.png" class="creature school-xanh" style="top: 52%; left: 48%;" alt="Cá xanh">

        <!-- Đàn cá vàng (Gốc: đầu phải, đuôi trái) -->
        <img src="cavang.png" class="creature school-vang" style="top: 68%; left: 22%;" alt="Cá vàng">
        <img src="cavang.png" class="creature school-vang" style="top: 76%; left: 34%;" alt="Cá vàng">
        <img src="cavang.png" class="creature school-vang" style="top: 72%; left: 12%;" alt="Cá vàng">
    </div>

    <script>
        // Bật/Tắt nhạc thủy cung
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = '🔇 Bật nhạc thủy cung';
            } else {
                music.play();
                musicBtn.innerHTML = '🔊 Tắt nhạc thủy cung';
            }
            isPlaying = !isPlaying;
        }

        // Quản lý chuyển động
        const swimmers = [];

        function registerSwimmer(el, config) {
            swimmers.push({
                el: el,
                x: el.offsetLeft || Math.random() * (window.innerWidth - 150),
                baseY: el.offsetTop || config.startY,
                vx: config.vx, // Vận tốc ngang (+ sang phải, - sang trái)
                defaultFace: config.defaultFace, // Hướng mặt ảnh gốc ('left' hoặc 'right')
                bobAmp: config.bobAmp || 0, // Biên độ nhấp nhô lên xuống (px)
                bobSpeed: config.bobSpeed || 0, // Tốc độ nhấp nhô
                phase: config.phase || Math.random() * Math.PI * 2,
                passThrough: config.passThrough || false // true = đi xuyên mép màn hình, false = đụng tường quay đầu
            });
        }

        window.addEventListener('load', () => {
            const H = window.innerHeight;

            // Tàu ngầm: lặn gần đáy, đi ngang xuyên qua màn hình (không quay đầu)
            registerSwimmer(document.getElementById('taungam'), {
                startY: H * 0.80, vx: 0.45, defaultFace: 'right', bobAmp: 6, bobSpeed: 0.008, passThrough: true
            });

            // Tiên cá: bơi chậm rãi, nhấp nhô nhẹ nhàng (đầu gốc bên trái)
            registerSwimmer(document.getElementById('tienca'), {
                startY: H * 0.35, vx: -0.25, defaultFace: 'left', bobAmp: 30, bobSpeed: 0.009
            });

            // Rùa biển & Cá mập: cùng tốc độ cực kỳ thư thả
            registerSwimmer(document.getElementById('turtle'), {
                startY: H * 0.64, vx: 0.22, defaultFace: 'right', bobAmp: 10, bobSpeed: 0.007
            });
            registerSwimmer(document.getElementById('shark'), {
                startY: H * 0.12, vx: 0.22, defaultFace: 'right', bobAmp: 8, bobSpeed: 0.007
            });

            // Bạch tuộc: trôi chậm tầng đáy
            registerSwimmer(document.getElementById('bachtuot'), {
                startY: H * 0.78, vx: -0.20, defaultFace: 'right', bobAmp: 15, bobSpeed: 0.01
            });

            // 3 Thợ lặn: lặn lên xuống êm ái + trôi ngang chậm đụng tường lật trái/phải
            registerSwimmer(document.getElementById('diver1'), {
                startY: H * 0.38, vx: 0.18, defaultFace: 'right', bobAmp: 130, bobSpeed: 0.007, phase: 0
            });
            registerSwimmer(document.getElementById('diver2'), {
                startY: H * 0.45, vx: -0.16, defaultFace: 'right', bobAmp: 150, bobSpeed: 0.006, phase: 2.1
            });
            registerSwimmer(document.getElementById('diver3'), {
                startY: H * 0.40, vx: 0.20, defaultFace: 'right', bobAmp: 140, bobSpeed: 0.0075, phase: 4.2
            });

            // Đàn cá xám (đầu gốc bên trái) - bơi chậm rãi
            document.querySelectorAll('.school-xam').forEach((el, idx) => {
                registerSwimmer(el, {
                    startY: el.offsetTop, vx: -0.34, defaultFace: 'left', bobAmp: 8, bobSpeed: 0.01, phase: idx * 0.8
                });
            });

            // Đàn cá xanh (đầu gốc bên phải) - bơi chậm rãi
            document.querySelectorAll('.school-xanh').forEach((el, idx) => {
                registerSwimmer(el, {
                    startY: el.offsetTop, vx: 0.36, defaultFace: 'right', bobAmp: 10, bobSpeed: 0.011, phase: idx * 0.7
                });
            });

            // Đàn cá vàng (đầu gốc bên phải) - bơi chậm rãi
            document.querySelectorAll('.school-vang').forEach((el, idx) => {
                registerSwimmer(el, {
                    startY: el.offsetTop, vx: 0.32, defaultFace: 'right', bobAmp: 7, bobSpeed: 0.01, phase: idx * 0.9
                });
            });

            animate();
        });

            const
