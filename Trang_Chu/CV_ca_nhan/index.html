<!DOCTYPE html>
<html lang="vi">

    <title>CV Cá Nhân - Trịnh Bảo Trân</title>
    <link rel="stylesheet" href="style.css">

    <!-- CSS trang trí hoa và thỏ (không làm ảnh hưởng bố cục gốc) -->
    <style>
        .cv-container {
            position: relative; /* Làm điểm tựa để ghim họa tiết vào các góc CV */
        }

        .avatar-box {
            position: relative;
            display: inline-block;
        }

        /* Đôi tai thỏ lấp ló phía trên ảnh đại diện */
        .deco-bunny-ears {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 28px;
            pointer-events: none;
            z-index: 2;
        }

        /* Cành hoa đào góc trên bên phải */
        .deco-top-right {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 150px;
            pointer-events: none;
            z-index: 10;
        }

        /* Đôi thỏ trắng nâu & bụi hoa góc dưới bên trái */
        .deco-bottom-left {
            position: absolute;
            bottom: -10px;
            left: -15px;
            width: 170px;
            pointer-events: none;
            z-index: 10;
        }

        /* Bé thỏ trắng ngồi góc dưới bên phải */
        .deco-bottom-right {
            position: absolute;
            bottom: -8px;
            right: -10px;
            width: 95px;
            pointer-events: none;
            z-index: 10;
        }

        /* Hoa nhỏ điểm xuyết cạnh tiêu đề */
        .deco-inline-flower {
            display: inline-block;
            vertical-align: middle;
            margin-left: 6px;
            margin-top: -4px;
        }
    </style>
</head>
