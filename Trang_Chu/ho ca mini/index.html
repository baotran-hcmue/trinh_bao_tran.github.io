<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Cá Vui Nhộn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="content">
        <!-- Cá mập bơi từ trái sang phải -->
        <div id="shark">
            <img src="aquarium/shark.png" alt="Cá mập" width="220">
        </div>

        <!-- Rùa biển bơi chậm từ phải sang trái -->
        <div id="turtle">
            <img src="aquarium/turtle.png" alt="Rùa biển" width="160">
        </div>

        <!-- Đàn cá vàng -->
        <div id="goldFishSchool">
            <img src="aquarium/goldFishSchool.png" alt="Đàn cá vàng" width="180">
        </div>

        <!-- Đàn cá nhỏ mờ phía xa -->
        <div id="faintSchool">
            <img src="aquarium/faintSchool.png" alt="Đàn cá nhỏ" width="150">
        </div>

        <!-- Thợ lặn 1: Lặn lên xuống nhẹ nhàng bên trái -->
        <div id="diver1">
            <img src="aquarium/diver1.png" alt="Thợ lặn 1" width="130">
        </div>

        <!-- Thợ lặn 2: Bơi chéo từ dưới lên trên -->
        <div id="diver2">
            <img src="aquarium/diver2.png" alt="Thợ lặn 2" width="130">
        </div>

        <!-- Thợ lặn 3: Bơi tuần tra ngang tầng đáy -->
        <div id="diver3">
            <img src="aquarium/diver3.png" alt="Thợ lặn 3" width="130">
        </div>
    </div>
</body>
</html>
